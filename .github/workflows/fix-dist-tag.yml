name: Fix dist-tag
on: workflow_dispatch
jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: |
          npm dist-tag add n8n-nodes-sociallinks@0.1.0 latest
          npm dist-tag ls n8n-nodes-sociallinks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
